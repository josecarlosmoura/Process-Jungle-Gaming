# Montado em /etc/nginx/conf.d/default.conf dentro da imagem nginx:1.27-alpine (docker-compose.yml,
# servico "nginx") - substitui so o server block padrao da imagem; o nginx.conf principal da propria
# imagem (events{}, http{} com "include /etc/nginx/conf.d/*.conf;") permanece intocado.
upstream wagering_app {
    server app-1:3000;
    server app-2:3000;
    server app-3:3000;
}

server {
    listen 80;

    location / {
        proxy_pass http://wagering_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Unica forma de distinguir, de fora, qual replica respondeu cada requisicao (T307) sem
        # nenhuma mudanca na aplicacao - $upstream_addr e preenchido pelo proprio nginx com o
        # "ip:porta" do upstream escolhido pelo round-robin.
        add_header X-Upstream-Addr $upstream_addr always;
    }
}
