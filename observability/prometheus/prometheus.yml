global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Nomes de servico Docker (app-1/app-2/app-3), nunca IPs - resolvidos via DNS interno da rede
# "wagering-net" (ARCHITECTURE.md secao 5). A porta e sempre 3000, fixa dentro de cada container
# (docker-compose.yml, x-app-service) - so a porta publicada pelo nginx no host muda.
scrape_configs:
  - job_name: wagering-app
    metrics_path: /metrics
    static_configs:
      - targets: ["app-1:3000", "app-2:3000", "app-3:3000"]
        labels:
          service: distributed-wagering-processor
