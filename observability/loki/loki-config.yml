auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# boltdb-shipper + filesystem: armazenamento local em disco, suficiente para observabilidade de
# ambiente de desenvolvimento/testes manuais - nunca usado como configuracao de produção
# multi-tenant (fora de escopo do desafio, ARCHITECTURE.md secao 12.3).
schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h
