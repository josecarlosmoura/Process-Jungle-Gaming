include:
  - docker-compose.infra.yml

# Config compartilhada pelas 3 replicas da aplicacao (app-1/app-2/app-3) - 3 servicos nomeados,
# nunca "deploy.replicas"/"--scale" (Diagrama-Arquitetura.md secao 5 ja desenha a topologia com
# nomes fixos). Cada um so sobrescreve "hostname", para que o campo "hostname" de cada linha de
# log (pino, via os.hostname()) leia "app-1"/"app-2"/"app-3" em vez do id opaco do container -
# unica mudanca necessaria para distinguir qual replica logou o que, sem tocar codigo da aplicacao.
x-app-service: &app-service
  build:
    context: .
    dockerfile: Dockerfile
  environment:
    PORT: "3000"
    NODE_ENV: production
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_USER: ${DB_USER}
    DB_PASSWORD: ${DB_PASSWORD}
    DB_NAME: ${DB_NAME}
    LOCALSTACK_ENDPOINT: http://localstack:4566
    AWS_REGION: ${AWS_REGION}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    LEDGER_CURSOR_SECRET: ${LEDGER_CURSOR_SECRET}
  networks:
    - wagering-net
  depends_on:
    postgres:
      condition: service_healthy
    localstack:
      condition: service_healthy
    localstack-init:
      condition: service_completed_successfully
    migrate:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "curl", "-sf", "http://localhost:3000/health/ready"]
    interval: 5s
    timeout: 5s
    retries: 10
    start_period: 15s

services:
  # One-shot: aplica as migrations uma unica vez antes de qualquer replica de "app-*" iniciar.
  # Nunca dentro do CMD/entrypoint delas - as 3 subindo ao mesmo tempo tentando "migration:up"
  # simultaneamente correriam a mesma migration sem nenhuma garantia de lock distribuido contra
  # essa corrida especifica. Builda o estagio "build" do Dockerfile (o unico com ts-node/
  # @mikro-orm/cli e o codigo-fonte TypeScript - "runtime", usado por "app-*", nao tem nenhum
  # dos dois).
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      LOCALSTACK_ENDPOINT: http://localstack:4566
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      LEDGER_CURSOR_SECRET: ${LEDGER_CURSOR_SECRET}
    command: ["bun", "run", "migration:up"]
    networks:
      - wagering-net
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app-1:
    <<: *app-service
    hostname: app-1

  app-2:
    <<: *app-service
    hostname: app-2

  app-3:
    <<: *app-service
    hostname: app-3

  # Round-robin entre as 3 replicas, unico ponto de entrada publico da aplicacao (Diagrama-
  # Arquitetura.md secao 5). "depends_on: service_healthy" garante que o nginx so inicia depois
  # das 3 replicas saudaveis - com as 3 ja respondendo, uma parando depois (ex.: "docker compose
  # stop app-2") nao derruba o load balancer: o "proxy_next_upstream" default do nginx (error
  # timeout) tenta a proxima replica da lista sem nenhuma config extra.
  nginx:
    image: nginx:1.27-alpine
    container_name: wagering-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - wagering-net
    depends_on:
      app-1:
        condition: service_healthy
      app-2:
        condition: service_healthy
      app-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
