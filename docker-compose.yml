services:
  postgres:
    image: postgres:16-alpine
    container_name: wagering-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - wagering-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  localstack:
    image: localstack/localstack:3
    container_name: wagering-localstack
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: ${AWS_REGION}
    ports:
      - "4566:4566"
    networks:
      - wagering-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  localstack-init:
    image: amazon/aws-cli:2.17.60
    container_name: wagering-localstack-init
    # roda uma unica vez e sai (exit 0) - nao e um servico de longa duracao, so garante que
    # as filas existam sempre que o ambiente sobe via "docker compose up". Dentro da rede do
    # Compose o LocalStack e alcancado pelo nome do servico, nunca por "localhost" (isso so
    # vale do lado de fora, no host, onde a porta e publicada).
    entrypoint: ["sh", "/scripts/setup-queues.sh"]
    environment:
      SQS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    volumes:
      - ./scripts/setup-queues.sh:/scripts/setup-queues.sh:ro
    networks:
      - wagering-net
    depends_on:
      localstack:
        condition: service_healthy
    restart: "no"

networks:
  wagering-net:
    name: wagering-net

volumes:
  postgres_data:
    name: postgres_data
